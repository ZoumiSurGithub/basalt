# Teste le projet a chaque envoi. Sur une etiquette "v*" (ex. v0.2.0), publie une version
# GitHub avec des archives pretes a l'emploi : c'est ce que telechargent get.sh et update.sh.
# Une etiquette avec un tiret (v0.3.0-dev.1) donne une preversion.
name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# Un nouvel envoi sur la meme branche annule la compilation precedente, devenue inutile
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Ubuntu 22.04 : l'executable fonctionne aussi sous Debian 12 et les Ubuntu plus recents
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Les bibliotheques deja compilees sont gardees d'une fois sur l'autre : seul Basalt
      # est recompile, ce qui ramene la duree de plusieurs minutes a une ou deux
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y liblua5.4-0
      # Inscrit dans l'executable : branche ou etiquette, commit, date. Fixe des le debut,
      # pour que les tests et la compilation finale partagent exactement le meme travail.
      - run: echo "BASALT_BUILD=${GITHUB_REF_NAME} ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_ENV"
      # Tests compiles en mode « release » : la compilation finale reprend ensuite ce qui
      # est deja fait, au lieu de tout recompiler une seconde fois
      - run: cargo test --release --locked
      - name: Compilation
        run: cargo build --release --locked
      - name: Archive
        run: |
          mkdir basalt
          cp -r target/release/basalt plugins data docs README.md CHANGELOG.md LICENSE basalt.service start.sh update.sh basalt/
          # Lua 5.4 est livre avec le serveur : rien a installer sur la machine d'arrivee
          cp -L /usr/lib/x86_64-linux-gnu/liblua5.4.so.0 basalt/liblua5.4.so.0
          cp /usr/share/doc/liblua5.4-0/copyright basalt/LICENCE-Lua.txt
          # Le depot d'ou viendront les mises a jour est inscrit dans update.sh
          sed -i "s|@REPO@|${GITHUB_REPOSITORY}|g" basalt/update.sh
          chmod 755 basalt/basalt basalt/start.sh basalt/update.sh
          tar czf basalt-linux-x64.tar.gz basalt
          sha256sum basalt-linux-x64.tar.gz > basalt-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-linux-x64
          path: |
            basalt-linux-x64.tar.gz
            basalt-linux-x64.tar.gz.sha256
      # Notes de la version : sa section de CHANGELOG.md (la compilation echoue si elle
      # manque, ou si l'etiquette ne correspond pas a la version de Cargo.toml)
      - name: Notes de version
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh .github/notes.sh "${GITHUB_REF_NAME}"
      - name: Notes de la branche dev
        if: github.ref == 'refs/heads/dev'
        run: sh .github/notes.sh dev
      # Publiee des que Linux est pret, sans attendre Windows
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Basalt ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            basalt-linux-x64.tar.gz
            basalt-linux-x64.tar.gz.sha256
      # Branche « dev » : chaque envoi remplace la preversion « dev-latest », sans etiquette
      # a poser. Installation : ./update.sh -v dev
      - name: Publication de la branche dev
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Version de développement (branche dev)
          body_path: notes.md
          prerelease: true
          files: |
            basalt-linux-x64.tar.gz
            basalt-linux-x64.tar.gz.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Lua 5.4 (lua54.dll)
        shell: cmd
        run: |
          curl -L -o lua.tar.gz https://www.lua.org/ftp/lua-5.4.7.tar.gz
          tar xzf lua.tar.gz
          cd lua-5.4.7\src
          del lua.c luac.c
          cl /nologo /O2 /MD /LD /DLUA_BUILD_AS_DLL /Felua54.dll *.c
          copy lua54.dll ..\..\lua54.dll
      # Les tests sont faits par la compilation Linux ; ici, seulement l'executable Windows
      - name: Compilation
        shell: pwsh
        run: |
          $env:BASALT_BUILD = "$env:GITHUB_REF_NAME $($env:GITHUB_SHA.Substring(0,7)) $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mmZ'))"
          cargo build --release --locked
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory basalt | Out-Null
          Copy-Item target\release\basalt.exe, lua54.dll, README.md, CHANGELOG.md, LICENSE basalt\
          Copy-Item plugins basalt\plugins -Recurse
          Copy-Item data basalt\data -Recurse
          Compress-Archive -Path basalt\* -DestinationPath basalt-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-windows-x64
          path: basalt-windows-x64.zip
      - name: Notes de version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sh .github/notes.sh "${GITHUB_REF_NAME}"
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Basalt ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: basalt-windows-x64.zip
      - name: Publication de la branche dev
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Version de développement (branche dev)
          prerelease: true
          files: basalt-windows-x64.zip
